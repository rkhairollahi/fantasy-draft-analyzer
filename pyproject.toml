[project]
name = "fantasy-draft-analyzer"
version = "0.1.0"
description = "Live ESPN fantasy football draft analyzer: board, tiers, needs, runs and news."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "playwright>=1.44",
]

[project.scripts]
dfa = "dfa.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dfa = ["server/templates/*.html", "server/static/*"]
